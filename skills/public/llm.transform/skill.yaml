id: llm.transform
name: Text Transform
description: Transform input text according to a natural language instruction (translate, reformat, summarize, rewrite, etc.)
engine: llm
inputs:
  - name: text
    type: string
    description: The source text to transform
    required: true
  - name: instruction
    type: string
    description: Natural language instruction describing how to transform the text
    required: true
outputs:
  - name: text
    type: string
    description: The transformed text result
    required: true
